[project]
name = "squisher-deconv"
version = "0.1.0"
description = "Slab-streaming deconvolution and sample-based scaling for squisher"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Chaichontat Sriworarat", email = "csriwor1@jh.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "imagecodecs>=2026.5.10",
    "loguru>=0.7.3",
    "matplotlib>=3.10.0",
    "numpy>=2.4.6",
    "scipy>=1.16.0",
    "tifffile>=2026.6.1",
    "typer>=0.26.5",
]

[project.scripts]
squisher-deconv = "squisher_deconv.cli:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]

[project.optional-dependencies]
gpu = [
    "cupy-cuda12x>=13.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
