name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install

      - name: Check lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check --output-format=concise squisher/src squisher/tests lightsheet/src lightsheet/tests

      - name: Test squisher
        run: uv run --package squisher pytest -q squisher/tests

      - name: Test lightsheet
        run: uv run --package squisher-lightsheet pytest -q lightsheet/tests

  build-windows-exe:
    runs-on: windows-latest
    needs: test
    permissions:
      contents: write
    defaults:
      run:
        working-directory: squisher
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install

      - name: Build executable
        shell: pwsh
        run: ./scripts/build-windows-exe.ps1

      - name: Smoke test executable
        shell: pwsh
        env:
          SQUISHER_EXE: ${{ github.workspace }}\squisher\dist\squisher.exe
        run: uv run pytest -q tests/test_exe_smoke.py

      - name: Upload executable
        uses: actions/upload-artifact@v5
        with:
          name: squisher-windows-exe
          path: squisher/dist/squisher.exe

      - name: Publish executable release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "squisher-exe-${{ github.sha }}"
          $title = "squisher.exe ${{ github.sha }}"
          $notes = "Windows standalone executable built from commit ${{ github.sha }}."
          if (gh release view $tag 2>$null) {
              Write-Host "Release $tag already exists; leaving existing asset unchanged."
          } else {
              gh release create $tag dist\squisher.exe --target "${{ github.sha }}" --title $title --notes $notes
          }
