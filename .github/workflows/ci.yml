name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Check lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check --output-format=concise src tests

      - name: Test
        run: uv run pytest -q

  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Build executable
        shell: pwsh
        run: ./scripts/build-windows-exe.ps1

      - name: Smoke test executable
        shell: pwsh
        run: ./dist/squisher.exe --help

      - name: Upload executable
        uses: actions/upload-artifact@v5
        with:
          name: squisher-windows-exe
          path: dist/squisher.exe
