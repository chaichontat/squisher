[tool.uv.workspace]
members = ["squisher", "lightsheet", "lightsheet-psf", "deconv", "segment"]

[tool.pytest.ini_options]
markers = ["gpu: requires a CUDA-capable GPU"]

[tool.uv]
override-dependencies = ["scipy>=1.16.0"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
